# 百工·坊 QA —— qa 分支：门禁复跑 + tgz 试用包。
# tgz 供测试侧 npm i <tgz> 试用；刻意不做版本号变更与 registry 发布（属 main 职责）。
# 三分支分工：develop 门禁 / qa 本文件 / main 正式发布。

name: QA 流水线 (qa)

on:
  push:
    branches: [qa]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 质量门禁 (check + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: check
        run: npm run check
      - name: smoke
        run: npm run smoke

  qa-pack:
    name: QA 试用包 (tgz)
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build
      - name: npm pack
        run: npm pack --pack-destination .
      - name: 上传试用包
        uses: actions/upload-artifact@v4
        with:
          name: qa-tgz
          path: ./*.tgz
          retention-days: 14
