# 百工·坊 CI —— develop 分支：日常开发门禁（共享基础库）。
# 门禁与本地完全同链：npm ci → check（tsc + eslint + vitest + build）→ smoke。
# smoke 必须在 check 之后同一环境跑：verify.mjs 需要根 node_modules 与 dist 同时在场。
# 三分支分工：
#   develop → ci.yml：本门禁；
#   qa      → qa.yml：门禁 + tgz 试用包；
#   main    → release.yml：门禁 + 正式 tgz + GitHub Release。

name: CI 门禁 (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 质量门禁 (check + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: check
        run: npm run check
      - name: smoke
        run: npm run smoke
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: ignore
