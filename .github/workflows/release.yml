# 百工·坊发布 —— main 分支：门禁复跑 + 正式 tgz + GitHub Release。
# Release 以 package.json 的版本号打 tag（v{version}）；
# 每次正式发布前请先在 main 上提升版本号，未提升时将更新同名 Release。
# npm registry 发布（如需）另行决策，暂不在此流水线中执行。
# 三分支分工：develop 门禁 / qa 试用包 / main 本文件。

name: 发布流水线 (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: 质量门禁 (check + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: check
        run: npm run check
      - name: smoke
        run: npm run smoke

  release-lib:
    name: 正式发布 (tgz + Release)
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build
      - name: npm pack
        run: npm pack --pack-destination .
      - name: 读取版本号
        id: ver
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ github.event.repository.name }} v${{ steps.ver.outputs.version }}
          body: |
            正式发布（由 main 分支流水线自动生成）。
            发布前请确认已在 main 上提升 package.json 版本号。
          files: ./*.tgz
